# Einziger Weg zur Live-Seite: Tests → Paket bauen → Veröffentlichen → Live-Prüfung.
# Voraussetzung (einmalig): Settings → Pages → Source = "GitHub Actions".
# Damit ist der alte automatische Ablauf "pages build and deployment" (Deploy from branch) abgeschaltet.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rollback: Release-Tag, der erneut veröffentlicht werden soll (z. B. v0.2.3). Leer = aktueller Stand von main.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Eingabe prüfen (nur Release-Tags dürfen erneut veröffentlicht werden)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then echo "Manuelle Veröffentlichung nur von main aus starten."; exit 1; fi
          if [ -n "${{ inputs.ref }}" ] && ! [[ "${{ inputs.ref }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "ref muss ein Release-Tag wie v0.2.3 sein."; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Simulation, Konsistenz, Release-Regeln
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser-Durchlauf (Ende-zu-Ende)
        run: npm run test:e2e
      - name: Auslieferungspaket bauen
        run: npm run build
      - name: Paket für GitHub Pages bereitstellen
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Veröffentlichen
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  live-check:
    name: Live-Prüfung
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Veröffentlichte Version prüfen (HTML, Skripte, Service Worker; keine Testdateien öffentlich)
        run: node scripts/check-live.mjs https://coachfrancisco92.github.io/fussball-iq-kids/ "" 420
